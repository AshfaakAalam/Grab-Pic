{% extends "base.html" %}

{% block title %}Create Event | Event Photos{% endblock %}

{% block content %}
<h1>Create Event</h1>
<p class="subtitle">Give your event a name. You'll upload photos on the next page.</p>

<div class="panel" style="max-width: 520px;">
    <form method="POST" action="{{ url_for('create_event') }}">
        <div class="field">
            <label for="event_name">Event name</label>
            <input type="text" id="event_name" name="event_name" value="{{ event_name or '' }}"
                   placeholder="e.g. Birthday Party" maxlength="100" required autofocus>
        </div>

        <button type="submit" class="btn">Create Event</button>
    </form>
</div>
{% endblock %}
