<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Event Photos{% endblock %}</title>
    <style>
        :root {
            --bg: #eef1f6;
            --card: #ffffff;
            --ink: #1c2433;
            --muted: #5b6578;
            --line: #d9dfea;
            --primary: #2f5bea;
            --primary-dark: #2448c4;
            --ok-bg: #e4f5ea;
            --ok-ink: #1b6b3a;
            --err-bg: #fdeaea;
            --err-ink: #a12626;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
        }

        a { color: var(--primary); }

        .site-header {
            background: var(--card);
            border-bottom: 1px solid var(--line);
        }

        .site-header .inner {
            max-width: 960px;
            margin: 0 auto;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .brand {
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--ink);
            text-decoration: none;
        }

        .site-nav a {
            margin-left: 18px;
            color: var(--muted);
            text-decoration: none;
            font-weight: 500;
        }

        .site-nav a:hover { color: var(--primary); }

        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 36px 20px 60px;
        }

        h1 { margin: 0 0 6px; font-size: 1.9rem; }
        .subtitle { margin: 0 0 28px; color: var(--muted); }

        .panel {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 24px;
        }

        .btn {
            display: inline-block;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .btn:hover { background: var(--primary-dark); }
        .btn:focus-visible, input:focus-visible, a:focus-visible {
            outline: 3px solid #9db4ff;
            outline-offset: 2px;
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1.5px solid var(--primary);
        }

        .btn-outline:hover { background: var(--primary); color: #fff; }

        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px 12px;
            font-size: 1rem;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
        }

        label { display: block; font-weight: 600; margin-bottom: 6px; }
        .field { margin-bottom: 18px; }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-weight: 500;
        }

        .message.success { background: var(--ok-bg); color: var(--ok-ink); }
        .message.error { background: var(--err-bg); color: var(--err-ink); }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="inner">
            <a class="brand" href="{{ url_for('home') }}">Event Photos</a>
            <nav class="site-nav">
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('my_events') }}">My Events</a>
                <a href="{{ url_for('create_event') }}">Create Event</a>
            </nav>
        </div>
    </header>

    <main>
        {% if success %}
            <div class="message success">{{ success }}</div>
        {% endif %}
        {% for error in errors or [] %}
            <div class="message error">{{ error }}</div>
        {% endfor %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
